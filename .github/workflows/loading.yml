name: Load Status

on: 
  push:
  workflow_dispatch:
  schedule:
    - cron: '5 4 10 1-12 *' #At 04:05 on day-of-month 10 in every month from January through December.

jobs:
   loading-pharo-10:
    runs-on: ubuntu-latest
    name: Pharo64-10
    steps:
      - uses: actions/checkout@v6
      - uses: ba-st-actions/pharo-ci@v10
        with:
          spec: .smalltalkci/.loading.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
   loading-pharo-11:
    runs-on: ubuntu-latest
    name: Pharo64-11
    steps:
      - uses: actions/checkout@v6
      - uses: ba-st-actions/pharo-ci@v11
        with:
          spec: .smalltalkci/.loading.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
   loading-pharo-12:
    runs-on: ubuntu-latest
    name: Pharo64-12
    steps:
      - uses: actions/checkout@v6
      - uses: ba-st-actions/pharo-ci@v12
        with:
          spec: .smalltalkci/.loading.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
   loading-pharo-13:
    runs-on: ubuntu-latest
    name: Pharo64-13
    steps:
      - uses: actions/checkout@v6
      - uses: ba-st-actions/pharo-ci@v13
        with:
          spec: .smalltalkci/.loading.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
